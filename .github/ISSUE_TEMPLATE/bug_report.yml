name: Bug report / 报告问题
description: Report something that is not working. 支持中文或英文。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English or Chinese is welcome. Please [search existing issues](https://github.com/WolfExplode/research-connected/issues) first.
        Reports are public. Do not include API keys, private notes, unpublished research, or a full vault / data.json.
        支持中文。反馈公开可见，请勿上传密钥、私人笔记、未公开研究材料或完整库数据。
  - type: textarea
    id: problem
    attributes:
      label: What went wrong? / 出现了什么问题？
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Research Connected version / 插件版本
      description: Find it in Settings → Community plugins. 在设置的第三方插件列表中查看。
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version / Obsidian 版本
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system / 操作系统
      placeholder: macOS, Windows, Linux…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Describe what you clicked or entered. 请说明输入内容和操作顺序。
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual result / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Optional context / 补充信息（可选）
      description: Public DOI/OpenAlex ID, graph pane or note embed, layout, sampling depth, screenshots, or redacted errors. For incorrect paper data or links, include the source supporting the expected result.
